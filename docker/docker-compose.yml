# Isolated stack for the G2 iMessage bridge project.
# Deliberately kept separate from /opt/docker/docker-compose.yml — do not
# merge into the main stack; this uses network_mode: host on tetherd for
# direct Bluetooth (BlueZ/D-Bus/HCI) access to the passed-through USB adapter
# (0cf3:e009), which the main stack's containers do not need or use.
services:
  tetherd:
    build: ./tetherd
    container_name: g2-tetherd
    network_mode: host
    privileged: true   # needed for raw HCI access (btmgmt, bluetoothd); can be
                        # narrowed later to specific --cap-add/--device entries
                        # once we confirm exactly what's required.
    labels:
      # Scopes willfarrell/autoheal (below) to only ever restart this one
      # container - never touches bridge/tailscale/or anything in the main
      # media stack, even though autoheal itself needs broad docker.sock
      # access to work at all.
      - autoheal=true
    healthcheck:
      # See healthcheck.sh's own comment: bt_status alone isn't a reliable
      # signal here, since it stays "ok" even after the MAP OBEX session
      # has silently died (a known tetherd limitation - it only attempts
      # the MAP session once at startup, no automatic retry). This actually
      # round-trips a real bt_list_threads call through the live MAP
      # session, which is what glasses-app polling depends on.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 12s
      retries: 3
      start_period: 45s
    volumes:
      - ./tetherd/data:/root/.config/tether
      # Critical: BlueZ's pairing/bond storage (bluetoothd) lives here, not
      # in tether's own config dir above. Without this mount, any container
      # recreate (`docker compose down/up`, not just `restart`) silently
      # wipes every Bluetooth bond - including the iPad's hard-won dual
      # BR/EDR+LE pairing - and the whole pairing dance has to be redone
      # from scratch (unpair on phone, re-pair, re-grant MAP/PBAP
      # permissions, wait for ANCS toggles to reappear, etc).
      - ./tetherd/bluetooth:/var/lib/bluetooth
      # tetherd's bt_* commands (threads/messages/send/status) only answer
      # over its local UNIX socket, never TCP (see docs/PROTOCOL.md
      # upstream: "local-only ... because everything here is personal
      # data"). Sharing this directory with the bridge container is how the
      # bridge reaches that socket - see docker/bridge/src/tetherClient.js.
      - ./tetherd/run:/run/user/0/tether
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: g2-bridge
    # host networking so tailscale (also host-networked, below) can reach
    # this service over 127.0.0.1. The bridge itself binds only to
    # 127.0.0.1 inside its own process (see src/index.js), so it is never
    # reachable from the LAN directly - only via the tailscale container
    # proxying to it over loopback.
    network_mode: host
    volumes:
      # Same shared socket directory as tetherd, above - this is how the
      # bridge talks to tetherd's bt_* commands; there is no TCP path.
      - ./tetherd/run:/run/user/0/tether
    env_file:
      - ./bridge/.env
    depends_on:
      - tetherd
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: g2-tailscale
    hostname: g2-gateway
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      # Tagged (not ephemeral) key: this is a persistent server node, not a
      # throwaway CI runner - see docker/tailscale/README.md for how the
      # auth key was generated and why.
    env_file:
      - ./tailscale/.env
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve-config.json:/config/serve-config.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  autoheal:
    # Watches for any container labeled autoheal=true (only g2-tetherd,
    # above) reporting Docker HEALTHCHECK status "unhealthy", and restarts
    # exactly that container - this is what makes a dropped Bluetooth MAP
    # session (see healthcheck.sh/entrypoint.sh's own comments: tetherd
    # never retries the MAP session on its own after startup) self-heal
    # without a manual SSH-in-and-restart every time.
    #
    # Security tradeoff, spelled out: this needs read/write access to the
    # host's Docker socket to call the restart API - broad in principle,
    # but AUTOHEAL_CONTAINER_LABEL scopes its actual *behavior* to only
    # ever act on labeled containers. It does not join network_mode: host
    # and has no other volumes, so its blast radius if compromised is
    # "can start/stop/restart containers", not "can read tetherd's
    # Bluetooth bond data or the bridge's token".
    image: willfarrell/autoheal:latest
    container_name: g2-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks: {}
